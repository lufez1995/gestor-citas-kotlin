spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/gestor_citas?serverTimezone=UTC}
    username: ${DB_USERNAME:citas}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
server:
  error:
    include-message: always
app:
  jwt-secret: ${JWT_SECRET}
  admin-email: ${ADMIN_EMAIL}
  admin-password: ${ADMIN_PASSWORD}
